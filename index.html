<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Reloj Buenos Aires</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#050608; color:#f5f5f5; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  #photo {
    position:fixed; inset:0;
    background-size:cover; background-position:center;
    opacity:0;
    transition:opacity 1.8s ease-in-out;
    z-index:0;
  }
  #shade {
    position:fixed; inset:0;
    background:rgba(0,0,0,.32);
    opacity:0;
    transition:opacity 1.2s ease;
    z-index:1;
  }
  body.photo-mode #photo { opacity:1; }
  body.photo-mode #shade { opacity:1; }
  body.photo-mode .screen {
    justify-content:flex-start;
    align-items:flex-start;
    padding:30px 42px;
    text-shadow:0 2px 8px rgba(0,0,0,.9);
  }
  body.photo-mode #calendar {
    width:145px; margin-bottom:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.55);
  }
  body.photo-mode #cal-weekday { font-size:14px; padding:5px 4px 3px; }
  body.photo-mode #cal-day { font-size:68px; padding:6px 2px 2px; }
  body.photo-mode #cal-monthyear { font-size:11px; padding:3px 4px 6px; }
  body.photo-mode #time { font-size:92px; letter-spacing:-.04em; }
  body.photo-mode .weather { margin-top:16px; gap:24px; }
  body.photo-mode #icon { font-size:52px; }
  body.photo-mode .weather-data { gap:24px; }
  body.photo-mode .metric { min-width:95px; }
  body.photo-mode .value { font-size:38px; }
  body.photo-mode .label { font-size:15px; }
  body.photo-mode #condition { margin-top:10px; font-size:18px; }
  .cold { color:#55b8ff; }
  .mild { color:#ffd84d; }
  .warm { color:#ff9b3d; }
  #icon { filter: saturate(1.35); }
  .screen {
    width:100vw; height:100vh;
    min-width:100%; min-height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:30px 48px 24px;
  }
  #date { display:none; }
  #calendar {
    width:250px;
    background:#f7f3e8;
    color:#111;
    text-align:center;
    border-radius:3px;
    box-shadow:0 5px 16px rgba(0,0,0,.45);
    overflow:hidden;
    margin-bottom:20px;
    font-family: Georgia, "Times New Roman", serif;
  }
  #cal-weekday {
    padding:9px 8px 5px;
    font-size:24px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    border-bottom:1px solid #cfc9ba;
  }
  #cal-day {
    font-size:122px;
    line-height:.88;
    font-weight:700;
    padding:10px 4px 4px;
    font-variant-numeric:tabular-nums;
  }
  #cal-monthyear {
    padding:5px 8px 10px;
    font-size:21px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  #calendar.red-day #cal-day { color:#c51616; }
  #calendar.normal-day #cal-day { color:#111; }
  #time {
    font-size:218px;
    line-height:.95;
    font-weight:300;
    letter-spacing:-.045em;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  #seconds { opacity:.58; }
  .weather {
    margin-top:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:52px;
  }
  #icon {
    font-size:92px;
    line-height:1;
  }
  .weather-data {
    display:flex;
    align-items:center;
    gap:46px;
  }
  .metric { text-align:center; min-width:140px; }
  .value {
    font-size:62px;
    font-weight:400;
    white-space:nowrap;
  }
  .label {
    margin-top:.4vh;
    font-size:21px;
    opacity:.58;
  }
  #condition {
    margin-top:2.2vh;
    font-size:25px;
    opacity:.72;
  }
  #status {
    position:fixed; right:18px; bottom:12px;
    font-size:13px; opacity:.32;
  }

  @media (max-width: 1000px) {
    #time { font-size:17vw; }
    #date { font-size:3.3vw; }
    .value { font-size:5vw; }
    #icon { font-size:7.3vw; }
  }
</style>
</head>
<body>
<div id="photo"></div>
<div id="shade"></div>
<main class="screen" style="position:relative;z-index:2;">
  <div id="date"></div>
  <div id="calendar" class="normal-day">
    <div id="cal-weekday">---</div>
    <div id="cal-day">--</div>
    <div id="cal-monthyear">---</div>
  </div>
  <div id="time"><span id="hm">--:--</span><span id="seconds">:--</span></div>

  <section class="weather">
    <div id="icon">◌</div>
    <div class="weather-data">
      <div class="metric">
        <div class="value" id="temp">--°</div>
        <div class="label">Buenos Aires</div>
      </div>
      <div class="metric">
        <div class="value" id="feels">--°</div>
        <div class="label">Sensación</div>
      </div>
      <div class="metric">
        <div class="value" id="humidity">--%</div>
        <div class="label">Humedad</div>
      </div>
    </div>
  </section>

  <div id="condition">Actualizando clima…</div>
  <div id="status"></div>
</main>

<script>
(function () {
  var TZ = "America/Argentina/Buenos_Aires";
  var LAT = -34.6037;
  var LON = -58.3816;

  function capitalize(s) {
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  }

  var holidayDates = {};
  var holidayYearLoaded = null;

  // Fallback para feriados nacionales de fecha fija si la consulta online falla.
  var FIXED_HOLIDAYS = {
    "01-01": true, "03-24": true, "04-02": true, "05-01": true,
    "05-25": true, "06-20": true, "07-09": true, "12-08": true, "12-25": true
  };

  async function loadArgentinaHolidays(year) {
    if (holidayYearLoaded === year) return;
    try {
      var r = await fetch("https://date.nager.at/api/v3/PublicHolidays/" + year + "/AR", {cache:"no-store"});
      if (!r.ok) throw new Error("HTTP " + r.status);
      var days = await r.json();
      holidayDates = {};
      days.forEach(function(h) { holidayDates[h.date] = h.localName || h.name; });
      holidayYearLoaded = year;
      updateCalendar();
    } catch(e) {
      holidayYearLoaded = year; // usa fallback de fechas fijas
    }
  }

  function baDateParts() {
    var parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: TZ, year:"numeric", month:"2-digit", day:"2-digit", weekday:"long"
    }).formatToParts(new Date());
    var v = {};
    parts.forEach(function(p){ v[p.type] = p.value; });
    return v;
  }

  function updateCalendar() {
    var now = new Date();
    var es = new Intl.DateTimeFormat("es-AR", {
      timeZone: TZ, weekday:"long", day:"numeric", month:"long", year:"numeric"
    }).formatToParts(now);
    var v = {};
    es.forEach(function(p){ v[p.type] = p.value; });

    var en = baDateParts();
    var iso = en.year + "-" + en.month + "-" + en.day;
    var md = en.month + "-" + en.day;
    var sunday = en.weekday === "Sunday";
    var holiday = !!holidayDates[iso] || !!FIXED_HOLIDAYS[md];

    document.getElementById("cal-weekday").textContent = v.weekday;
    document.getElementById("cal-day").textContent = v.day;
    document.getElementById("cal-monthyear").textContent = v.month + " " + v.year;

    var cal = document.getElementById("calendar");
    cal.className = (sunday || holiday) ? "red-day" : "normal-day";

    loadArgentinaHolidays(Number(en.year));
  }

  function updateClock() {
    var now = new Date();

    var dateText = new Intl.DateTimeFormat("es-AR", {
      timeZone: TZ,
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    }).format(now);

    var parts = new Intl.DateTimeFormat("es-AR", {
      timeZone: TZ,
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hourCycle: "h23"
    }).formatToParts(now);

    var vals = {};
    parts.forEach(function(p) { vals[p.type] = p.value; });

    updateCalendar();
    document.getElementById("hm").textContent = vals.hour + ":" + vals.minute;
    document.getElementById("seconds").textContent = ":" + vals.second;
  }

  function weatherInfo(code, isDay) {
    if (code === 0) return { icon: isDay ? "☀️" : "🌙", text: "Despejado" };
    if (code === 1) return { icon: isDay ? "🌤️" : "🌙", text: "Mayormente despejado" };
    if (code === 2) return { icon: "⛅", text: "Parcialmente nublado" };
    if (code === 3) return { icon: "☁️", text: "Nublado" };
    if (code === 45 || code === 48) return { icon: "🌫️", text: "Niebla" };
    if (code === 51 || code === 53 || code === 55) return { icon: "🌦️", text: "Llovizna" };
    if (code === 56 || code === 57) return { icon: "🌧️", text: "Llovizna helada" };
    if (code === 61 || code === 63 || code === 65) return { icon: "🌧️", text: "Lluvia" };
    if (code === 66 || code === 67) return { icon: "🌧️", text: "Lluvia helada" };
    if (code === 71 || code === 73 || code === 75 || code === 77) return { icon: "🌨️", text: "Nieve" };
    if (code === 80 || code === 81 || code === 82) return { icon: "🌦️", text: "Chaparrones" };
    if (code === 85 || code === 86) return { icon: "🌨️", text: "Chaparrones de nieve" };
    if (code === 95) return { icon: "⛈️", text: "Tormenta" };
    if (code === 96 || code === 99) return { icon: "⛈️", text: "Tormenta con granizo" };
    return { icon: "🌡️", text: "Estado del tiempo" };
  }


  function tempClass(value) {
    value = Number(value);
    if (value < 10) return "cold";
    if (value <= 20) return "mild";
    return "warm";
  }

  // PORTARRETRATOS:
  // Subí tus fotos al repo dentro de una carpeta llamada "fotos"
  // y agregá aquí sus nombres. Ejemplo: "fotos/vacaciones.jpg".
  var PHOTOS = [
    // "fotos/foto1.jpg",
    // "fotos/foto2.jpg",
    // "fotos/foto3.jpg"
  ];
  var PHOTO_START_HOUR = 8;
  var PHOTO_END_HOUR = 22;
  var PHOTO_CHANGE_MS = 60000;
  var photoIndex = 0;

  function buenosAiresHour() {
    return Number(new Intl.DateTimeFormat("en-US", {
      timeZone: TZ, hour: "2-digit", hourCycle: "h23"
    }).format(new Date()));
  }

  function updateMode() {
    var h = buenosAiresHour();
    var active = PHOTOS.length > 0 && h >= PHOTO_START_HOUR && h < PHOTO_END_HOUR;
    document.body.classList.toggle("photo-mode", active);
    if (active && !document.getElementById("photo").style.backgroundImage) showNextPhoto();
  }

  function showNextPhoto() {
    if (!PHOTOS.length) return;
    var photo = document.getElementById("photo");
    photo.style.backgroundImage = 'url("' + PHOTOS[photoIndex] + '")';
    photoIndex = (photoIndex + 1) % PHOTOS.length;
  }

  async function updateWeather() {
    var status = document.getElementById("status");
    try {
      var url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + LAT +
        "&longitude=" + LON +
        "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day" +
        "&temperature_unit=celsius" +
        "&timezone=America%2FArgentina%2FBuenos_Aires";

      var res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);

      var data = await res.json();
      var w = data.current;
      var info = weatherInfo(Number(w.weather_code), Number(w.is_day) === 1);

      var tempEl = document.getElementById("temp");
      var feelsEl = document.getElementById("feels");
      tempEl.textContent = Math.round(w.temperature_2m) + "°";
      feelsEl.textContent = Math.round(w.apparent_temperature) + "°";
      tempEl.className = "value " + tempClass(w.temperature_2m);
      feelsEl.className = "value " + tempClass(w.apparent_temperature);
      document.getElementById("humidity").textContent = Math.round(w.relative_humidity_2m) + "%";
      document.getElementById("icon").textContent = info.icon;
      document.getElementById("condition").textContent = info.text;
      status.textContent = "";
    } catch (e) {
      status.textContent = "Sin conexión · reintentando";
    }
  }

  updateClock();
  setInterval(updateClock, 1000);

  updateWeather();
  setInterval(updateWeather, 10 * 60 * 1000);

  updateMode();
  setInterval(updateMode, 60 * 1000);
  setInterval(function () {
    if (document.body.classList.contains("photo-mode")) showNextPhoto();
  }, PHOTO_CHANGE_MS);
})();
</script>
</body>
</html>
